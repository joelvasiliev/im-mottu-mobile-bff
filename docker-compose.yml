services:
  app:
    container_name: mottu-bff
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RICK_AND_MORTY_API_URL: https://rickandmortyapi.com/api/character/
      CAT_API_URL: https://api.thecatapi.com/v1/
    volumes:
      - .:/app
    command: npm run start

  redis:
    container_name: redis
    image: redis:latest
    ports:
      - '6379:6379'
